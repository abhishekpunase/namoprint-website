# Merge these lines into the EXISTING server { } for api.namoprints.in.
# Do not replace the whole vhost — keep your current ssl_certificate paths.
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Without client_max_body_size, nginx defaults to 1m. Large photo uploads then
# return 413 with no CORS headers, which the browser reports as a CORS failure.

client_max_body_size 50m;
client_body_timeout 120s;
proxy_connect_timeout 120s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;

